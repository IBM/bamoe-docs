# ============================================
# KOGITO CONFIGURATION
# ============================================
kogito.service.url=http://${quarkus.http.host}:${quarkus.http.port}
kogito.jobs-service.url=http://${quarkus.http.host}:${quarkus.http.port}
kogito.data-index.url=http://${quarkus.http.host}:${quarkus.http.port}

# ============================================
# PERSISTENCE CONFIGURATION
# ============================================
kogito.persistence.type=jdbc

# H2 Database (Development)
%dev.kie.flyway.enabled=true
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.username=kogito
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:default;NON_KEYWORDS=VALUE,KEY

# ============================================
# EMAIL NOTIFICATION CONFIGURATION (v9)
# ============================================

# SMTP Configuration for MailHog (Development)
%dev.quarkus.mailer.host=localhost
%dev.quarkus.mailer.port=1025
%dev.quarkus.mailer.from=test@kogito.com
%dev.quarkus.mailer.auth-methods=
%dev.quarkus.mailer.start-tls=DISABLED
%dev.quarkus.mailer.mock=false

# Kafka Configuration for Deadline Events (Development)
# Outgoing channel - publishes deadline events
%dev.mp.messaging.outgoing.kogito-deadline-events.connector=smallrye-kafka
%dev.mp.messaging.outgoing.kogito-deadline-events.topic=kogito-deadline-events
%dev.mp.messaging.outgoing.kogito-deadline-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Incoming channel - consumes deadline events for notifications
%dev.mp.messaging.incoming.kogito-deadline-events-consumer.connector=smallrye-kafka
%dev.mp.messaging.incoming.kogito-deadline-events-consumer.topic=kogito-deadline-events
%dev.mp.messaging.incoming.kogito-deadline-events-consumer.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
%dev.mp.messaging.incoming.kogito-deadline-events-consumer.group.id=kogito-deadline-consumer

%dev.kafka.bootstrap.servers=localhost:9092

# ============================================
# USER GROUPS CONFIGURATION
# ============================================
%dev.bamoe.devui.users.jdoe.groups=jdoe,approvers
%dev.bamoe.devui.users.admin.groups=admin,approvers

# ============================================
# DEV UI CONFIGURATION
# ============================================
%dev.quarkus.devservices.enabled=false
%dev.quarkus.kogito.devservices.enabled=false
%dev.quarkus.swagger-ui.always-include=true

# ============================================
# DEBUG LOGGING FOR TROUBLESHOOTING
# ============================================
# Enable debug logging to see deadline event publishing
%dev.quarkus.log.category."org.kie.kogito.event".level=DEBUG
%dev.quarkus.log.category."io.smallrye.reactive.messaging".level=DEBUG
%dev.quarkus.log.category."org.kie.kogito.mail".level=DEBUG
%dev.quarkus.log.category."org.jbpm.addons.quarkus.task.notification".level=DEBUG

# ============================================
# TEST CONFIGURATION
# ============================================
%test.kie.flyway.enabled=true
%test.quarkus.devservices.enabled=false
%test.quarkus.kogito.devservices.enabled=false
%test.quarkus.oidc.enabled=false
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=kogito
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;NON_KEYWORDS=VALUE,KEY

# Test: Use in-memory messaging instead of Kafka
%test.mp.messaging.outgoing.kogito-deadline-events.connector=smallrye-in-memory
%test.mp.messaging.outgoing.kogito-deadline-events.merge=true
%test.quarkus.mailer.mock=true

