# Quarkus Application Configuration for v9
quarkus.application.name=external-services-security-v9
quarkus.http.port=8080

# Kogito Service URLs
kogito.service.url=http://localhost:8080
kogito.jobs-service.url=http://localhost:8080
kogito.data-index.url=http://localhost:8080

# Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# REST Client Configuration for External API
# Using MicroProfile REST Client format with configKey "external-api"
quarkus.rest-client.external-api.url=https://jsonplaceholder.typicode.com
quarkus.rest-client.external-api.scope=jakarta.inject.Singleton

# REST Client Timeouts
quarkus.rest-client.external-api.connect-timeout=30000
quarkus.rest-client.external-api.read-timeout=60000

# OIDC Configuration (Keycloak)
quarkus.oidc.enabled=true
quarkus.oidc.auth-server-url=http://127.0.0.1:8180/realms/kie
quarkus.oidc.client-id=kie-app
quarkus.oidc.credentials.secret=secret
quarkus.oidc.application-type=service
quarkus.oidc.discovery-enabled=true

# Security Configuration
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated
quarkus.http.auth.permission.public.paths=/q/*,/docs/*
quarkus.http.auth.permission.public.policy=permit

# Role-based Access Control
quarkus.security.users.embedded.enabled=false

# SOAP/CXF Configuration (example — only enable if you have a SOAP service to call)
# Uncomment and configure if using Quarkus CXF for SOAP integration:
# quarkus.cxf.path=/soap
# quarkus.cxf.client.my-soap-service.service-interface=com.example.security.service.MySoapServiceInterface
# quarkus.cxf.client.my-soap-service.client-endpoint-url=http://your-soap-service/endpoint

# Persistence Configuration
# kogito.persistence.type=jdbc tells the framework to use JDBC persistence
# This is required for Flyway to initialize the Kogito schema (correlation_instances, etc.)
kogito.persistence.type=jdbc

# H2 Database Configuration
kie.flyway.enabled=true
quarkus.datasource.db-kind=h2
quarkus.datasource.username=kogito
quarkus.datasource.jdbc.url=jdbc:h2:mem:default;NON_KEYWORDS=VALUE,KEY

# Hibernate Configuration
# Use 'none' to rely on Flyway migrations for schema creation with proper column sizes
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.validate-in-dev-mode=false
quarkus.hibernate-orm.log.sql=false

# Logging Configuration
quarkus.log.level=INFO
quarkus.log.category."com.example.security".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# Development Mode Settings
# Disable OIDC and authentication in dev mode for testing without Keycloak
%dev.quarkus.oidc.enabled=false
%dev.quarkus.http.auth.permission.authenticated.policy=permit

# Test Mode Settings
# Disable OIDC and authentication in test mode for integration tests
%test.quarkus.oidc.enabled=false
%test.quarkus.http.auth.permission.authenticated.policy=permit

# Disable Dev Services (requires authentication to pull IBM BAMOE images)
%dev.quarkus.devservices.enabled=false
%dev.quarkus.kogito.devservices.enabled=false
%test.quarkus.devservices.enabled=false
%test.quarkus.kogito.devservices.enabled=false


