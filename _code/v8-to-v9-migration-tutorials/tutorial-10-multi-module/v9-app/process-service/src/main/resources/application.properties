# Quarkus Configuration
quarkus.application.name=multi-module-process-service-v9

# HTTP Configuration
quarkus.http.port=8080

# Kogito Service URLs
kogito.service.url=http://${quarkus.http.host}:${quarkus.http.port}
kogito.jobs-service.url=http://${quarkus.http.host}:${quarkus.http.port}
kogito.data-index.url=http://${quarkus.http.host}:${quarkus.http.port}

# Persistence Configuration
kogito.persistence.type=jdbc

# H2 Database Configuration
kie.flyway.enabled=true
quarkus.datasource.db-kind=h2
quarkus.datasource.username=kogito
quarkus.datasource.jdbc.url=jdbc:h2:mem:default;NON_KEYWORDS=VALUE,KEY

# OpenAPI / Swagger UI Configuration
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.smallrye-openapi.path=/q/openapi

# OpenAPI Information
mp.openapi.extensions.smallrye.info.title=Multi-Module Process Service API
mp.openapi.extensions.smallrye.info.version=1.0.0-SNAPSHOT
mp.openapi.extensions.smallrye.info.description=Multi-module BAMOE v9 example with data model, business rules, and process service
mp.openapi.extensions.smallrye.info.contact.name=BAMOE Support
mp.openapi.extensions.smallrye.info.license.name=Apache 2.0
mp.openapi.extensions.smallrye.info.license.url=https://www.apache.org/licenses/LICENSE-2.0.html

# Data Index Configuration (Required for dev-ui process instances visibility)
kogito.data-index.quarkus.enabled=true

# Jobs Service Configuration
kogito.jobs-service.embedded=true

# Development Mode Configuration
%dev.quarkus.log.console.enable=true
%dev.quarkus.log.console.level=INFO
%dev.quarkus.log.category."org.kie".level=DEBUG

# Disable external Dev Services (requires quay.io access)
%dev.quarkus.devservices.enabled=false
%dev.quarkus.kogito.devservices.enabled=false

# Dev UI Configuration
%dev.quarkus.smallrye-openapi.path=/docs/openapi.json
%dev.quarkus.http.test-port=0
%dev.quarkus.dev-ui.cors.enabled=false
%dev.quarkus.kogito.data-index.graphql.ui.always-include=true

# Production Mode Configuration
%prod.quarkus.log.console.level=INFO
