# Quarkus Configuration
quarkus.http.port=8080

# Kogito Configuration
# These properties are required for POST endpoint generation
kogito.service.url=http://${quarkus.http.host}:${quarkus.http.port}
kogito.jobs-service.url=http://${quarkus.http.host}:${quarkus.http.port}
kogito.data-index.url=http://${quarkus.http.host}:${quarkus.http.port}

# Hibernate ORM Configuration
# Disabling Hibernate schema generation because we use Flyway
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.validate-in-dev-mode=false
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=no-file

# Kogito Persistence Configuration
kogito.persistence.type=jdbc
kogito.persistence.optimistic.lock=true

# Flyway Configuration
%dev.kie.flyway.enabled=true

# Security Configuration
# Keeping it disabled for simplicity (as per bamoe-examples)
quarkus.oidc.enabled=false
kogito.auth.enabled=false

# Logging Configuration
quarkus.log.console.enable=true
quarkus.log.console.level=INFO
quarkus.log.category."org.kie".level=INFO
quarkus.log.category."org.jbpm".level=INFO
quarkus.log.category."com.example".level=DEBUG

# REST Configuration
quarkus.rest.path=/

# Health Check
quarkus.smallrye-health.root-path=/q/health

######################
# Development Profile
######################

# Data Source Configuration (H2 Database) - Dev Profile
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.username=kogito
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:default;NON_KEYWORDS=VALUE,KEY

# Disable Dev Services
%dev.quarkus.devservices.enabled=false
%dev.quarkus.kogito.devservices.enabled=false

# Swagger and Dev UI Configuration - Dev Profile
%dev.quarkus.http.cors=true
%dev.quarkus.http.cors.origins=*
%dev.quarkus.dev-ui.cors.enabled=false
%dev.quarkus.smallrye-openapi.path=/docs/openapi.json
%dev.quarkus.http.test-port=0
%dev.quarkus.swagger-ui.always-include=true
%dev.quarkus.kogito.data-index.graphql.ui.always-include=true

