# Kogito Configuration
kogito.service.url=http://${quarkus.http.host}:${quarkus.http.port}
kogito.jobs-service.url=http://${quarkus.http.host}:${quarkus.http.port}
kogito.data-index.url=http://${quarkus.http.host}:${quarkus.http.port}

# User Task Lifecycle Configuration
# Using WS-Human Task lifecycle (supports activate, start, complete, delegate, forward, etc.)
# WS-Human Task lifecycle provides full WS-HumanTask specification compliance
#kogito.usertasks.lifecycle=ws-human-task
# Disable Dev Services (prevents Docker/Testcontainers issues)
quarkus.devservices.enabled=false
quarkus.kogito.devservices.enabled=false

# Persistence Configuration
kogito.persistence.type=jdbc

# Flyway Configuration
# Enable Flyway for automatic database schema management
%dev.kie.flyway.enabled=true
%container.kie.flyway.enabled=true

# Development Mode - H2 Database
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.username=kogito
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:default;NON_KEYWORDS=VALUE,KEY;LOCK_TIMEOUT=10000;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
%dev.quarkus.datasource.jdbc.min-size=1
%dev.quarkus.datasource.jdbc.max-size=8


# Users who can work on the main review task (need 'reviewers' group)
%dev.bamoe.devui.users.reviewers.groups=reviewers
%dev.bamoe.devui.users.admin.groups=reviewers

# Escalation users (need both 'reviewers' to see tasks and 'management' for escalation)
%dev.bamoe.devui.users.supervisor.groups=reviewers,management
%dev.bamoe.devui.users.manager.groups=reviewers,management

# Register users for task reassignment (required for NotStartedReassign and NotCompletedReassign)
kogito.usertask.users=admin,reviewers,supervisor,manager

# Map usernames to email addresses for notifications
# Format: kogito.usertask.notification.email.<username>=<email-address>
kogito.usertask.notification.email.supervisor=supervisor@example.com
kogito.usertask.notification.email.manager=manager@example.com

# Production Mode - PostgreSQL
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${POSTGRES_USER}
%prod.quarkus.datasource.password=${POSTGRES_PASSWORD}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DB}

# Disable Hibernate schema generation
quarkus.hibernate-orm.database.generation=none

# Transaction settings to reduce deadlocks
quarkus.transaction-manager.default-transaction-timeout=30

# Security (disabled for simplicity)
quarkus.oidc.enabled=false
kogito.auth.enabled=false

# User Task Security Policy - Allow all users when auth is disabled
kogito.usertasks.security.policy=allow-all

# HTTP Configuration
quarkus.http.cors=true
quarkus.http.port=8080

# Swagger UI
quarkus.swagger-ui.always-include=true

# Dev UI Configuration
%dev.quarkus.smallrye-openapi.path=${quarkus.http.root-path}/docs/openapi.json
%dev.quarkus.http.test-port=0
%dev.quarkus.dev-ui.cors.enabled=false
%dev.quarkus.kogito.data-index.graphql.ui.always-include=true

# ============================================
# EMAIL NOTIFICATION CONFIGURATION
# ============================================
# Email notifications for NotCompletedNotify deadline handler

# SMTP Configuration for MailHog (Development)
%dev.quarkus.mailer.host=localhost
%dev.quarkus.mailer.port=1025
%dev.quarkus.mailer.from=noreply@example.com
%dev.quarkus.mailer.auth-methods=
%dev.quarkus.mailer.start-tls=DISABLED
# Disables mock mode so emails triggered by deadline events are sent to the configured SMTP server
# instead of being logged only.
%dev.quarkus.mailer.mock=false

# ============================================
# KAFKA CONFIGURATION FOR DEADLINE EVENTS
# ============================================
# Based on BAMOE reference examples pattern

# Kafka bootstrap servers
kafka.bootstrap.servers=localhost:9092

# Outgoing channel - publishes deadline events from the task notification system
mp.messaging.outgoing.kogito-deadline-events.connector=smallrye-kafka
mp.messaging.outgoing.kogito-deadline-events.topic=kogito-deadline-events
mp.messaging.outgoing.kogito-deadline-events.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# Incoming channel - consumes deadline events for notifications
mp.messaging.incoming.kogito-deadline-consumer.connector=smallrye-kafka
mp.messaging.incoming.kogito-deadline-consumer.topic=kogito-deadline-events
mp.messaging.incoming.kogito-deadline-consumer.value.deserializer=org.kie.kogito.mail.DeadlineEventDeserializer

