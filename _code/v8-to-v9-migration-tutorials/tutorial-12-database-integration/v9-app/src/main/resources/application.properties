
# ============================================
# HTTP CONFIGURATION
# ============================================
quarkus.http.port=8080

# ============================================
# KOGITO SERVICE URLS
# ============================================
# These URLs point to embedded services in Compact Architecture
kogito.service.url=http://localhost:${quarkus.http.port}
kogito.jobs-service.url=http://localhost:${quarkus.http.port}
kogito.data-index.url=http://localhost:${quarkus.http.port}

# ============================================
# DATASOURCE CONFIGURATION (H2 - Development)

quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE,KEY
quarkus.datasource.jdbc.enable-metrics=true
quarkus.datasource.devservices.enabled=false

# ============================================
# HIBERNATE ORM CONFIGURATION
# ============================================
# V8 Migration: Replaces org.kie.server.persistence.dialect
# Set to 'none' - KIE Flyway handles all Kogito internal schema creation.
# Do NOT use 'update' or 'create' — Kogito subsystem tables are managed by KIE Flyway only.
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.validate-in-dev-mode=false
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=no-file

# ============================================
# CORE PERSISTENCE CONFIGURATION
# ============================================
# Enables JDBC persistence for process instances
kogito.persistence.type=jdbc

# Enable optimistic locking for concurrent process instance access
kogito.persistence.optimistic.lock=true

# ============================================
# FLYWAY SCHEMA MANAGEMENT
# ============================================
# KIE Flyway automatically creates all Kogito internal tables on startup:
# - Workflow Engine: process_instances, correlation_instances, business_key_mapping, event_types
# - UserTask Service: jbpm_user_tasks and 14 related tables
# - Data-Index: processes, tasks, jobs, definitions, nodes, milestones, attachments, comments, kogito_data_cache
# - Jobs Service: job_details, job_service_management
# Disable in production and apply DDL scripts from bamoe-{VERSION}-db-utils.zip instead
kie.flyway.enabled=true

# ============================================
# TRANSACTION CONFIGURATION
# ============================================
# V8 Migration: Replaces manual UserTransaction management in EJB @Stateless beans
# Enable transactions globally for all Kogito operations
kogito.transactionEnabled=true

# Enable transactions for Process API operations
kogito.processes.transactionEnabled=true

# Enable transactions for UserTask API operations
kogito.usertasks.transactionEnabled=true

# ============================================
# DEV UI CONFIGURATION
# ============================================
quarkus.devservices.enabled=false
%dev.quarkus.swagger-ui.always-include=true
%dev.quarkus.kogito.data-index.graphql.ui.always-include=true

# ============================================
# DEVELOPMENT TASK USERS
# ============================================
# Defines users and their group memberships for the Dev UI task inbox.
# The 'Review Query Results' Human Task is assigned to 'john'.
# Format: %dev.bamoe.devui.users.<username>.groups=<group1>,<group2>,...
%dev.bamoe.devui.users.john.groups=john,managers,users

# ============================================
# POSTGRESQL PRODUCTION CONFIGURATION
# ============================================
# Uncomment these properties for PostgreSQL production deployment
# Comment out H2 configuration above when using PostgreSQL
#
# %postgresql.quarkus.datasource.db-kind=postgresql
# %postgresql.quarkus.datasource.username=bamoe-user
# %postgresql.quarkus.datasource.password=bamoe-pass
# %postgresql.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/bamoe-db
# %postgresql.quarkus.hibernate-orm.database.generation=none
# %postgresql.kie.flyway.enabled=false
#
# For SQL Server, add custom ORM mappings (bamoe-mssql-mappings dependency required):
# %mssql.quarkus.datasource.db-kind=mssql
# %mssql.quarkus.hibernate-orm.mapping-files=META-INF/bamoe-data-index-orm.xml,META-INF/bamoe-job-service-orm.xml
#
# For Oracle, add custom ORM mappings (bamoe-oracle-mappings dependency required):
# %oracle.quarkus.datasource.db-kind=oracle
# %oracle.quarkus.hibernate-orm.mapping-files=META-INF/bamoe-user-task-orm.xml,META-INF/bamoe-job-service-orm.xml
