# Packaging
# quarkus.package.jar.type=fast-jar

quarkus.swagger-ui.always-include=true

# REST endpoints for decisions aren't used so we can skip generation
# All endpoints can be disabled using this property
# kogito.generate.rest=false
kogito.generate.rest.decisions=false
kogito.generate.rest.processes=true

quarkus.kogito.devservices.enabled=false
quarkus.devservices.enabled=false


kogito.service.url=http://0.0.0.0:8080
kogito.jobs-service.url=http://0.0.0.0:8080
kogito.data-index.url=http://0.0.0.0:8080


quarkus.datasource.db-kind=h2
quarkus.datasource.username=kie
quarkus.datasource.jdbc.url=jdbc:h2:mem:default;NON_KEYWORDS=VALUE,KEY
quarkus.datasource.jdbc.min-size=1

 

# Development DS
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.username=kie
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:default;NON_KEYWORDS=VALUE,KEY

# User and Group Configuration for Task Assignment
# Define users and their groups to enable task claiming in Dev UI
%dev.bamoe.devui.users.supplier.groups=supplier,managers
%dev.bamoe.devui.users.managers.groups=supplier,managers
%dev.bamoe.devui.users.owners.groups=owners,managers
%dev.quarkus.datasource.jdbc.min-size=1
