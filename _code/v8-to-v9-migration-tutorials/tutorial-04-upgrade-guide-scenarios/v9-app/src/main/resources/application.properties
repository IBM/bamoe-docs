###############
# Persistence #
###############

# Tells Kogito Persistence what kind of persistence is configured.
kogito.persistence.type=jdbc

# BAMOE provides a separate Flyway subsystem that allows Kogito's and BAMOE's internal tables to be created and migrated
# without interfering with your own Flyway, if you're using it.
#
# This property enables/disables running this isolated Flyway mechanism automatically when the Business Service starts.
%prod.kie.flyway.enabled=false

# Replace <TODO>s with your Database's real configuration values for username, password and URLs.
#
# Configure your database connection here.
# Check out the BAMOE documentation for supported databases: https://www.ibm.com/docs/ibamoe
# https://quarkus.io/guides/datasource
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=<TODO>
%prod.quarkus.datasource.password=<TODO>
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://<TODO>:5432/kogito}
%prod.quarkus.datasource.reactive.url=${QUARKUS_DATASOURCE_REACTIVE_URL:postgresql://<TODO>:5432/kogito}


######################
# Persistence :: Dev #
######################

%dev.kie.flyway.enabled=true
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.username=kogito
# Added MODE=PostgreSQL to ensure better compatibility and larger default column sizes
# DB_CLOSE_DELAY=-1 keeps the database alive between connections
# DB_CLOSE_ON_EXIT=FALSE prevents database from closing when last connection closes
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:default;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE,KEY

# Hibernate ORM configuration for UserEntity
# Changed to 'none' to let Flyway handle all schema management
# This prevents conflicts between Hibernate and Flyway schema creation
%dev.quarkus.hibernate-orm.database.generation=none
%dev.quarkus.hibernate-orm.validate-in-dev-mode=false
%dev.quarkus.hibernate-orm.log.sql=false
%dev.quarkus.hibernate-orm.sql-load-script=no-file

# In production, validate the schema (requires manual schema management)
%prod.quarkus.hibernate-orm.database.generation=validate


############
# Security #
############

# Replace <TODO>s with your Identity Provider URL, OIDC Client ID and Secret
#
# https://quarkus.io/guides/security-oidc-configuration-properties-reference
%prod.kogito.auth.enabled=true
%prod.quarkus.oidc.enabled=true
%prod.quarkus.oidc.discovery-enabled=true
%prod.quarkus.oidc.tenant-enabled=true
%prod.quarkus.oidc.auth-server-url=<TODO>
%prod.quarkus.oidc.client-id=<TODO>
%prod.quarkus.oidc.credentials.secret=<TODO>
%prod.quarkus.oidc-proxy.enabled=true

%prod.quarkus.oidc.application-type=service
%prod.quarkus.http.auth.permission.authenticated.paths=/*
%prod.quarkus.http.auth.permission.authenticated.policy=authenticated
%prod.quarkus.http.auth.permission.public.paths=/q/*,/docs/openapi.json
%prod.quarkus.http.auth.permission.public.policy=permit

# If CORS is enabled, replace <TODO> with the list of origins allowed to access the Business Service
#
# https://quarkus.io/guides/security-cors
%prod.quarkus.http.cors=false
%prod.quarkus.http.cors.origins=<TODO>


###################
# Security :: Dev #
###################

%dev.quarkus.devservices.enabled=false
%dev.quarkus.kogito.devservices.enabled=false
%dev.kogito.auth.enabled=false
%dev.quarkus.oidc.enabled=false
%dev.quarkus.oidc-proxy.enabled=false
%dev.quarkus.http.cors=true
%dev.quarkus.http.cors.origins=*


############
# Services #
############

# These properties are residual from Distributed Architecture, where Data-Index, Data-Audit,
# and Jobs Service are external to the Business Service.
#
# They are still necessary, but won't be anymore in future BAMOE releases.
kogito.service.url=http://${quarkus.http.host}:${quarkus.http.port}${quarkus.http.root-path}
kogito.jobs-service.url=http://${quarkus.http.host}:${quarkus.http.port}${quarkus.http.root-path}
kogito.data-index.url=http://${quarkus.http.host}:${quarkus.http.port}${quarkus.http.root-path}


################
# Misc. :: Dev #
################

%dev.quarkus.smallrye-openapi.path=${quarkus.http.root-path}/docs/openapi.json
%dev.quarkus.http.test-port=0
%dev.quarkus.dev-ui.cors.enabled=false
%dev.quarkus.swagger-ui.always-include=true
%dev.quarkus.kogito.data-index.graphql.ui.always-include=true
# Development task users with group assignments
%dev.bamoe.devui.users.jdoe.groups=jdoe,PM,HR

