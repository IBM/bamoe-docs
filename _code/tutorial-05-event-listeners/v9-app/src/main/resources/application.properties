# Quarkus Configuration
quarkus.http.port=8080

# Kogito Configuration
kogito.service.url=http://localhost:${quarkus.http.port}

# Disable Dev Services (prevents Docker container startup issues)
quarkus.devservices.enabled=false
quarkus.kogito.devservices.enabled=false

# Logging Configuration
quarkus.log.console.enable=true
quarkus.log.console.level=INFO

# Event Listener Logging
quarkus.log.category."com.example.listeners".level=INFO

# Persistence Configuration
kogito.persistence.type=jdbc
kie.flyway.enabled=true

# Development Mode - H2 Database
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.username=kogito
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:default;NON_KEYWORDS=VALUE,KEY
%dev.quarkus.datasource.jdbc.min-size=1

# Disable Hibernate schema generation (Flyway handles it)
quarkus.hibernate-orm.database.generation=none

# Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# User/Group Mapping for Testing
kogito.usertask.user.john.groups=user
kogito.usertask.user.mary.groups=user,manager
kogito.usertask.user.admin.groups=user,manager,admin


