# Quarkus Configuration
quarkus.application.name=complex-data-models-v9

# HTTP Configuration
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Hibernate ORM - Entity Package Configuration
quarkus.hibernate-orm.packages=com.example.datamodels

# Development Mode - H2 Database
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# Hibernate ORM Configuration (Dev Mode)
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.sql-load-script=no-file
%dev.quarkus.hibernate-orm.log.format-sql=true

# PostgreSQL Profile Configuration
%postgresql.quarkus.datasource.db-kind=postgresql
%postgresql.quarkus.datasource.username=${POSTGRES_USER:postgres}
%postgresql.quarkus.datasource.password=${POSTGRES_PASSWORD:postgres}
%postgresql.quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:datamodels}
%postgresql.quarkus.hibernate-orm.database.generation=update
%postgresql.quarkus.hibernate-orm.log.sql=false

# OpenAPI / Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# Logging
quarkus.log.console.enable=true
quarkus.log.console.level=INFO
quarkus.log.category."com.example".level=DEBUG
quarkus.log.category."org.hibernate".level=INFO
# Dev Services (disable for manual database setup)
quarkus.devservices.enabled=false



